<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Your Love Card 💌</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  min-height:100vh;
  background:linear-gradient(135deg,#ffd6e5,#fff4f8);
  color:#512536;
}

.container{
  width:100%;
  max-width:440px;
  margin:auto;
  padding:22px 16px 40px;
}

.creator{
  background:white;
  border-radius:28px;
  padding:24px 20px;
  box-shadow:0 15px 45px rgba(100,40,70,.16);
}

.logo{
  text-align:center;
  font-size:42px;
}

h1{
  text-align:center;
  margin:8px 0;
  color:#d94f7c;
}

.subtitle{
  text-align:center;
  color:#9b6478;
  line-height:1.5;
}

label{
  display:block;
  margin-top:18px;
  margin-bottom:7px;
  font-weight:bold;
}

input[type="text"],
textarea,
select{
  width:100%;
  border:1px solid #efbfd0;
  border-radius:14px;
  padding:13px;
  font-size:15px;
  background:#fffafa;
  outline:none;
}

textarea{
  min-height:120px;
  resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#d94f7c;
}

.photoBox{
  border:2px dashed #e6a9be;
  border-radius:18px;
  padding:20px 12px;
  text-align:center;
  margin-top:8px;
}

.photoBox input{
  width:100%;
}

.previewPhoto{
  display:none;
  width:100%;
  max-height:300px;
  object-fit:cover;
  border-radius:20px;
  margin-top:15px;
}

button{
  width:100%;
  border:0;
  border-radius:25px;
  padding:14px;
  margin-top:20px;
  background:#dc5883;
  color:white;
  font-size:16px;
  font-weight:bold;
}

button:active{
  transform:scale(.97);
}

.preview{
  display:none;
  margin-top:25px;
}

.card{
  border-radius:30px;
  padding:25px 20px;
  text-align:center;
  background:linear-gradient(145deg,#fff7fa,#ffe3ed);
  box-shadow:0 12px 35px rgba(100,40,70,.18);
  animation:appear .7s ease;
}

@keyframes appear{
  from{
    opacity:0;
    transform:translateY(25px) scale(.97);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

.card h2{
  color:#d43f72;
  font-size:27px;
}

.cardMessage{
  white-space:pre-wrap;
  line-height:1.8;
  margin-top:18px;
}

.cardPhoto{
  display:none;
  width:100%;
  max-height:320px;
  object-fit:cover;
  border-radius:20px;
  margin:18px 0;
}

.heart{
  font-size:48px;
  animation:heartBeat 1.2s infinite;
}

@keyframes heartBeat{
  50%{
    transform:scale(1.18);
  }
}

.divider{
  margin:20px auto;
  width:70px;
  height:2px;
  background:#e48aa5;
}

.secondary{
  background:#b5549c;
}

.copyBox{
  display:none;
  margin-top:15px;
  padding:12px;
  border-radius:14px;
  background:#fff0f5;
  font-size:13px;
  word-break:break-all;
}

.theme1{
  background:linear-gradient(145deg,#fff7fa,#ffe3ed);
}

.theme2{
  background:linear-gradient(145deg,#fff9e8,#ffe9b8);
}

.theme3{
  background:linear-gradient(145deg,#f2f0ff,#ddd8ff);
}

.theme4{
  background:linear-gradient(145deg,#eafff5,#cffff0);
}

.small{
  text-align:center;
  font-size:12px;
  color:#a47787;
  margin-top:20px;
}
</style>
</head>

<body>

<div class="container">

<div class="creator">

<div class="logo">💌</div>

<h1>Create Your Card</h1>

<p class="subtitle">
Make a beautiful surprise for someone special ❤️
</p>

<label>💗 Name</label>

<input
id="name"
type="text"
placeholder="Enter their name"
>

<label>💌 Your Message</label>

<textarea
id="message"
placeholder="Write your special message here..."
></textarea>

<label>📸 Add Photo</label>

<div class="photoBox">

<p>Choose a photo from your phone</p>

<input
id="photo"
type="file"
accept="image/*"
>

<img
id="uploadedPreview"
class="previewPhoto"
>

</div>

<label>🎨 Choose Theme</label>

<select id="theme">

<option value="theme1">💕 Pink Love</option>

<option value="theme2">🌸 Soft Peach</option>

<option value="theme3">💜 Dreamy Purple</option>

<option value="theme4">💚 Soft Mint</option>

</select>

<button onclick="createCard()">
✨ Preview My Card
</button>

</div>


<div id="preview" class="preview">

<div id="card" class="card theme1">

<div class="heart">❤️</div>

<h2>
For <span id="cardName">Someone Special</span>
</h2>

<div class="divider"></div>

<img
id="cardPhoto"
class="cardPhoto"
>

<p
id="cardMessage"
class="cardMessage">
Your message will appear here...
</p>

<div class="divider"></div>

<p>
Made with love 💕
</p>

</div>

<button onclick="shareCard()">
🔗 Share Card
</button>

<button
class="secondary"
onclick="copyLink()">
📋 Copy Page Link
</button>

<div id="copyBox" class="copyBox"></div>

</div>

<p class="small">
Made with ❤️
</p>

</div>


<script>

let photoData = "";

const photoInput =
document.getElementById("photo");

const uploadedPreview =
document.getElementById("uploadedPreview");


photoInput.addEventListener("change", function(){

const file = this.files[0];

if(!file){
return;
}

const reader = new FileReader();

reader.onload = function(e){

photoData = e.target.result;

uploadedPreview.src = photoData;

uploadedPreview.style.display = "block";

};

reader.readAsDataURL(file);

});


function createCard(){

const name =
document.getElementById("name").value.trim();

const message =
document.getElementById("message").value.trim();

const theme =
document.getElementById("theme").value;


if(name === ""){

alert("Please enter a name ❤️");

return;

}


if(message === ""){

alert("Please write your message 💌");

return;

}


document.getElementById("cardName").textContent =
name;

document.getElementById("cardMessage").textContent =
message;


const card =
document.getElementById("card");

card.className =
"card " + theme;


const cardPhoto =
document.getElementById("cardPhoto");


if(photoData){

cardPhoto.src = photoData;

cardPhoto.style.display = "block";

}else{

cardPhoto.style.display = "none";

}


document.getElementById("preview").style.display =
"block";


window.scrollTo({

top:document.body.scrollHeight,

behavior:"smooth"

});

}


async function shareCard(){

const name =
document.getElementById("name").value;

const message =
document.getElementById("message").value;


const shareText =
"💌 A special card for " +
name +
"\n\n" +
message +
"\n\n❤️";


if(navigator.share){

try{

await navigator.share({

title:"A Special Card 💌",

text:shareText,

url:window.location.href

});

}catch(error){

console.log(error);

}

}else{

copyLink();

}

}


async function copyLink(){

const link =
window.location.href;

try{

await navigator.clipboard.writeText(link);

document.getElementById("copyBox").style.display =
"block";

document.getElementById("copyBox").textContent =
"Link copied! ❤️ " + link;

}catch(error){

prompt(
"Copy this link:",
link
);

}

}

</script>

</body>
</html>
